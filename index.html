<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tap Water</title>
  <style>
    :root { color-scheme: light dark; --bg: #f2f6fb; --card: #fff; --text: #0b1b2b; --muted: #5b6b7b; --blue: #0a73f2; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1118; --card: #16202b; --text: #eef4fa; --muted: #9aa9b8; --blue: #4db3ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 420px; background: var(--card); border-radius: 24px; padding: 32px 24px; text-align: center; }
    .drop { font-size: 56px; }
    h1 { margin: 8px 0; font-size: 28px; }
    p { color: var(--muted); margin: 8px 0; }
    strong { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <div class="drop">💧</div>
    <h1>Tap Water</h1>
    <p>This sticker logs a bottle of water in the <strong>Tap Water</strong> app.</p>
    <p>If you're seeing this page, Tap Water isn't installed on this iPhone yet. Install it, open it once, and tap the sticker again.</p>
  </main>
</body>
</html>
